name: 部署到 GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
      - name: 2. 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 3. 安装依赖
        run: npm ci
      - name: 4. 构建项目
        run: npm run build
      - name: 5. 配置 GitHub Pages
        uses: actions/configure-pages@v4
      - name: 6. 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: 7. 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
