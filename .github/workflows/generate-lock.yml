- name: 提交并推送
  env:
    PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  run: |
    git config --global user.name "angnlangnlangnl"
    git config --global user.email "angnlangnlangnl@example.com"
    git remote set-url origin https://angnlangnlangnl:${PAT_TOKEN}@github.com/angnlangnlangnl/ai-finance-assistant.git
    git add package-lock.json
    if git status --porcelain | grep -q "package-lock.json"; then
      git commit -m "🤖 自动生成完整的 package-lock.json"
      git push
    else
      echo "没有新的变更需要提交。"
    fi
