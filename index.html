<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI 金融助手 · MVP演示版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 保留原有样式，新增以下 */
        .api-config-panel {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
        }
        .api-key-input {
            background: #0a0a12;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 8px 12px;
            color: #e8e8f0;
            font-size: 13px;
            width: 100%;
            outline: none;
        }
        .api-key-input:focus {
            border-color: #3b82f6;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-executed {
            background: #1a3a2a;
            color: #4ade80;
        }
        .status-pending {
            background: #3a3a1a;
            color: #fbbf24;
        }
        .rebate-card {
            background: linear-gradient(135deg, #1a2a3a, #0f1a2a);
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
        }
        .rebate-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4ade80;
        }
        .trade-record {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
        }
        .btn-execute {
            background: #059669;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-execute:active {
            background: #047857;
            transform: scale(0.95);
        }
        .btn-execute.executed {
            background: #4b5563;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- 启动页和主应用保持原有结构，在消息列表后添加新面板 -->
    
    <!-- 在主应用的消息列表区域后，添加新的分析面板 -->
    <div id="app">
        <!-- 原有遮罩层、抽屉、顶部导航、快捷操作 -->
        
        <!-- 消息列表 -->
        <div id="messageList" class="flex-1 overflow-y-auto px-4 py-3 space-y-3"></div>
        
        <!-- ===== 新增：AI分析+执行+返利闭环面板 ===== -->
        <div id="mvpPanel" class="px-4 pb-3 bg-[#0a0a0f] border-t border-[#1a1a2a] flex-shrink-0">
            <!-- 这个面板会在初始化时动态渲染 -->
        </div>
        
        <!-- 原有输入区域 -->
        <div class="border-t border-[#1a1a2a] p-2 bg-[#0a0a0f] flex-shrink-0 safe-area-bottom">
            <!-- 原有输入框和按钮 -->
        </div>
    </div>

    <script>
        // ============ 在原有代码基础上新增MVP功能 ============
        
        // DeepSeek API配置
        const DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';
        let apiKey = localStorage.getItem('deepseek_api_key') || '';
        
        // 模拟用户数据库
        let currentUser = {
            id: 'user_demo_001',
            name: '演示用户',
            referrerId: 'agent_demo_01'
        };
        
        // 交易记录存储
        let tradeRecords = JSON.parse(localStorage.getItem('trade_records') || '[]');
        
        // 推广员返利数据
        let rebateData = JSON.parse(localStorage.getItem('rebate_data') || '{"totalRebate": 0, "pendingRebate": 0, "totalUsers": 1}');
        
        // ============ AI分析函数（接入DeepSeek） ============
        async function getAIAnalysis(symbol = 'ETH', marketData = null) {
            if (!apiKey) {
                return {
                    success: false,
                    message: '请先配置DeepSeek API Key（免费申请：platform.deepseek.com）',
                    fallback: true
                };
            }
            
            const defaultData = {
                'ETH': { price: 2800, change: 2.3, volatility: 3.2, sentiment: '中性偏多' },
                'BTC': { price: 65000, change: 1.8, volatility: 2.5, sentiment: '看多' },
                'SOL': { price: 120, change: 5.1, volatility: 4.8, sentiment: '看多' }
            };
            
            const data = marketData || defaultData[symbol] || defaultData['ETH'];
            
            const prompt = `你是一个专业的加密货币分析师。请分析${symbol}的短期趋势，给出操作建议。
            
当前市场数据：
- 价格：$${data.price}
- 24h涨跌：${data.change}%
- 波动率：${data.volatility}%
- 市场情绪：${data.sentiment}

请输出JSON格式的建议：
{
    "symbol": "${symbol}",
    "action": "buy/sell/hold",
    "confidence": 0-100,
    "entryPrice": 建议入场价,
    "stopLoss": 止损价,
    "targetPrice": 目标价,
    "reason": "简短理由"
}`;
            
            try {
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一个加密货币交易分析助手，输出严格JSON格式。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7
                    })
                });
                
                const result = await response.json();
                
                if (result.choices && result.choices[0]) {
                    const content = result.choices[0].message.content;
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        return {
                            success: true,
                            analysis: JSON.parse(jsonMatch[0]),
                            raw: content
                        };
                    }
                }
                
                return { success: false, message: 'AI分析失败，使用模拟数据' };
                
            } catch (error) {
                console.error('API调用失败:', error);
                return { success: false, message: '网络错误，使用模拟数据' };
            }
        }
        
        // ============ 模拟AI分析（当没有API Key时） ============
        function getSimulatedAnalysis(symbol) {
            const analyses = {
                'ETH': {
                    symbol: 'ETH', action: 'buy', confidence: 72,
                    entryPrice: 2780, stopLoss: 2650, targetPrice: 3100,
                    reason: 'ETH处于上升通道，RSI健康，建议逢低做多'
                },
                'BTC': {
                    symbol: 'BTC', action: 'hold', confidence: 65,
                    entryPrice: 64500, stopLoss: 62000, targetPrice: 70000,
                    reason: 'BTC高位震荡，等待突破确认后再入场'
                },
                'SOL': {
                    symbol: 'SOL', action: 'buy', confidence: 81,
                    entryPrice: 118, stopLoss: 105, targetPrice: 150,
                    reason: 'SOL生态活跃度激增，技术面强势突破'
                }
            };
            return analyses[symbol] || analyses['ETH'];
        }
        
        // ============ 执行交易记录 ============
        function executeTrade(analysis, amount = 1000) {
            const record = {
                id: 'trade_' + Date.now(),
                userId: currentUser.id,
                referrerId: currentUser.referrerId,
                symbol: analysis.symbol,
                action: analysis.action,
                entryPrice: analysis.entryPrice,
                amount: amount,
                timestamp: new Date().toISOString(),
                status: 'executed',
                rebateRate: 0.02, // 2%返利
                rebateAmount: amount * 0.02,
                aiConfidence: analysis.confidence
            };
            
            tradeRecords.push(record);
            localStorage.setItem('trade_records', JSON.stringify(tradeRecords));
            
            // 更新推广员返利
            rebateData.totalRebate += record.rebateAmount;
            rebateData.pendingRebate += record.rebateAmount;
            rebateData.totalUsers += 1;
            localStorage.setItem('rebate_data', JSON.stringify(rebateData));
            
            return record;
        }
        
        // ============ 渲染MVP面板 ============
        function renderMVPPanel() {
            const panel = document.getElementById('mvpPanel');
            const hasApiKey = !!apiKey;
            
            let html = `
            <div class="api-config-panel">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-semibold text-[#e8e8f0]">🔑 AI分析配置</h3>
                    <span class="status-badge ${hasApiKey ? 'status-executed' : 'status-pending'}">
                        ${hasApiKey ? '✅ AI已连接' : '⚠️ 使用模拟数据'}
                    </span>
                </div>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" class="api-key-input flex-1" 
                           placeholder="输入DeepSeek API Key (免费申请)" value="${apiKey}">
                    <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold tap-active">
                        保存
                    </button>
                </div>
                <p class="text-xs text-[#6a6a7a] mt-2">
                    💡 免费获取：<a href="https://platform.deepseek.com" target="_blank" class="text-blue-400 underline">platform.deepseek.com</a> 
                    注册即送500万tokens
                </p>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-2">
                <button onclick="requestAnalysis('ETH')" class="bg-[#1a1a2a] text-[#e8e8f0] p-3 rounded-xl text-sm font-medium tap-active hover:bg-[#2a2a3a]">
                    📊 分析ETH
                </button>
                <button onclick="requestAnalysis('BTC')" class="bg-[#1a1a2a] text-[#e8e8f0] p-3 rounded-xl text-sm font-medium tap-active hover:bg-[#2a2a3a]">
                    📊 分析BTC
                </button>
                <button onclick="requestAnalysis('SOL')" class="bg-[#1a1a2a] text-[#e8e8f0] p-3 rounded-xl text-sm font-medium tap-active hover:bg-[#2a2a3a]">
                    📊 分析SOL
                </button>
            </div>
            
            <div id="analysisResult" class="mb-2"></div>
            
            <div class="rebate-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-[#8a8a9a]">我的推广返利</p>
                        <div class="rebate-amount">$${rebateData.totalRebate.toFixed(2)}</div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-[#8a8a9a]">待结算</p>
                        <p class="text-lg font-semibold text-[#fbbf24]">$${rebateData.pendingRebate.toFixed(2)}</p>
                    </div>
                </div>
                <div class="mt-2 pt-2 border-t border-[#2a3a4a]">
                    <p class="text-xs text-[#8a8a9a]">推广用户：${rebateData.totalUsers}人 | 返利比例：2%</p>
                </div>
            </div>
            
            <div class="mt-2">
                <button onclick="showTradeHistory()" class="w-full bg-[#1a1a2a] text-[#8a8a9a] py-2 rounded-lg text-xs font-medium tap-active">
                    📋 查看交易记录 (${tradeRecords.length}笔)
                </button>
            </div>
            `;
            
            panel.innerHTML = html;
        }
        
        // ============ 请求AI分析 ============
        async function requestAnalysis(symbol) {
            const resultDiv = document.getElementById('analysisResult');
            
            // 显示加载状态
            resultDiv.innerHTML = `
                <div class="text-center py-4 text-sm text-[#6a6a7a]">
                    <div class="typing-cursor">AI分析中</div>
                </div>
            `;
            
            let analysis;
            let isRealAI = false;
            
            if (apiKey) {
                const result = await getAIAnalysis(symbol);
                if (result.success) {
                    analysis = result.analysis;
                    isRealAI = true;
                } else {
                    analysis = getSimulatedAnalysis(symbol);
                }
            } else {
                await new Promise(resolve => setTimeout(resolve, 800)); // 模拟延迟
                analysis = getSimulatedAnalysis(symbol);
            }
            
            // 渲染分析结果
            const actionColor = {
                'buy': '#4ade80',
                'sell': '#f87171',
                'hold': '#fbbf24'
            };
            
            const actionText = {
                'buy': '买入',
                'sell': '卖出',
                'hold': '持有'
            };
            
            resultDiv.innerHTML = `
                <div class="trade-record">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold">${analysis.symbol}</span>
                            <span class="status-badge ${isRealAI ? 'status-executed' : 'status-pending'}">
                                ${isRealAI ? '🤖 AI分析' : '📊 模拟分析'}
                            </span>
                        </div>
                        <span class="font-bold" style="color: ${actionColor[analysis.action]}">
                            ${actionText[analysis.action]} · ${analysis.confidence}%信心
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 text-center mb-3">
                        <div class="bg-[#0a0a12] p-2 rounded-lg">
                            <p class="text-xs text-[#6a6a7a]">入场价</p>
                            <p class="font-semibold text-sm">$${analysis.entryPrice}</p>
                        </div>
                        <div class="bg-[#0a0a12] p-2 rounded-lg">
                            <p class="text-xs text-[#6a6a7a]">止损价</p>
                            <p class="font-semibold text-sm text-[#f87171]">$${analysis.stopLoss}</p>
                        </div>
                        <div class="bg-[#0a0a12] p-2 rounded-lg">
                            <p class="text-xs text-[#6a6a7a]">目标价</p>
                            <p class="font-semibold text-sm text-[#4ade80]">$${analysis.targetPrice}</p>
                        </div>
                    </div>
                    
                    <p class="text-xs text-[#b0b0c0] mb-3">💡 ${analysis.reason}</p>
                    
                    <div class="flex gap-2">
                        <button onclick="executeAndRecord('${analysis.symbol}', ${analysis.entryPrice}, '${analysis.action}', ${analysis.confidence})" 
                                class="btn-execute flex-1" id="executeBtn_${analysis.symbol}">
                            ✅ 我已手动执行
                        </button>
                        <button onclick="copyAnalysis()" class="px-4 py-2 bg-[#1a1a2a] text-[#8a8a9a] rounded-lg text-xs font-semibold tap-active">
                            📋 复制
                        </button>
                    </div>
                    
                    <p class="text-xs text-[#5a5a6a] mt-2">
                        💰 执行后推广员将获得交易额2%的返利
                    </p>
                </div>
            `;
        }
        
        // ============ 执行并记录交易 ============
        function executeAndRecord(symbol, price, action, confidence) {
            const amount = 1000; // 模拟交易金额$1000
            const analysis = {
                symbol: symbol,
                action: action,
                entryPrice: price,
                confidence: confidence
            };
            
            const record = executeTrade(analysis, amount);
            
            // 更新按钮状态
            const btn = document.getElementById(`executeBtn_${symbol}`);
            if (btn) {
                btn.textContent = '✅ 已执行并记录';
                btn.classList.add('executed');
                btn.disabled = true;
            }
            
            // 更新返利显示
            renderMVPPanel();
            
            // 添加系统消息
            addSystemMessage(`✅ 交易记录成功！推广员获得 $${record.rebateAmount.toFixed(2)} 返利`);
            
            // 重新渲染分析结果以更新返利数据
            const resultDiv = document.getElementById('analysisResult');
            const currentHtml = resultDiv.innerHTML;
            // 保持分析结果不变，只更新返利卡片
        }
        
        // ============ 显示交易历史 ============
        function showTradeHistory() {
            if (tradeRecords.length === 0) {
                alert('暂无交易记录');
                return;
            }
            
            let historyHtml = '📋 交易记录\n\n';
            tradeRecords.slice(-5).forEach((record, index) => {
                const date = new Date(record.timestamp).toLocaleDateString('zh-CN');
                historyHtml += `${index + 1}. ${record.symbol} ${record.action.toUpperCase()} $${record.amount} @ $${record.entryPrice}\n`;
                historyHtml += `   返利: $${record.rebateAmount.toFixed(2)} | ${date}\n\n`;
            });
            
            alert(historyHtml);
        }
        
        // ============ 保存API Key ============
        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            apiKey = input.value.trim();
            localStorage.setItem('deepseek_api_key', apiKey);
            renderMVPPanel();
            addSystemMessage(apiKey ? '✅ API Key已保存，现在使用真实AI分析' : 'ℹ️ 使用模拟数据分析');
        }
        
        // ============ 复制分析 ============
        function copyAnalysis() {
            const resultDiv = document.getElementById('analysisResult');
            const text = resultDiv.innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 分析结果已复制');
            });
        }
        
        // ============ 初始化时调用 ============
        // 在原有初始化代码中添加：
        document.addEventListener('DOMContentLoaded', function() {
            // ... 原有初始化代码 ...
            
            // 初始化MVP面板
            renderMVPPanel();
            
            // 暴露全局函数
            window.requestAnalysis = requestAnalysis;
            window.executeAndRecord = executeAndRecord;
            window.saveApiKey = saveApiKey;
            window.showTradeHistory = showTradeHistory;
            window.copyAnalysis = copyAnalysis;
        });
        
        // 修改原有的sendMessage函数，添加对分析命令的响应
        const originalSendMessage = window.sendMessage;
        window.sendMessage = function(text) {
            const lower = text.toLowerCase();
            
            // 检测是否为分析请求
            const symbolMatch = text.match(/(ETH|BTC|SOL|以太坊|比特币|索拉纳)/i);
            if (symbolMatch && (lower.includes('分析') || lower.includes('建议') || lower.includes('怎么看'))) {
                const symbolMap = {
                    'ETH': 'ETH', '以太坊': 'ETH',
                    'BTC': 'BTC', '比特币': 'BTC',
                    'SOL': 'SOL', '索拉纳': 'SOL'
                };
                const symbol = symbolMap[symbolMatch[1].toUpperCase()] || symbolMatch[1].toUpperCase();
                requestAnalysis(symbol);
                return;
            }
            
            // 调用原有函数
            if (typeof originalSendMessage === 'function') {
                originalSendMessage(text);
            }
        };
    </script>
</body>
</html>
